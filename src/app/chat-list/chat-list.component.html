<div class="chat-list">
  <div class="chat-section">
    <div class="header">
      <div class="header-text">
        <h2>Chats</h2>
        <p>Recent conversations</p>
      </div>
    </div>



    <div class="search-container">
      <input
        type="text"
        placeholder="Search..."
        class="search-input"
        [(ngModel)]="searchTerm"
        aria-label="Search conversations" />
      <i class="search-icon"></i>
    </div>

    <div class="filter-tabs">
      <button
        class="tab"
        [class.active]="activeFilter === 'all'"
        (click)="setFilter('all')">All</button>

      <button
        class="tab"
        [class.active]="activeFilter === 'unread'"
        (click)="setFilter('unread')">Unread</button>

      <button
        class="tab"
        [class.active]="activeFilter === 'groups'"
        (click)="setFilter('groups')">Groups</button>
    </div>



    <!-- Conversations list -->
    <div class="conversations" (scroll)="onScroll($event)" style="height:400px; overflow-y:auto;" role="list">
      <div *ngFor="let chat of displayedChats; " class="conversation-item" (click)="selectChat(chat.userId)">
        <ng-container >
        <div class="avatar">
          <img [src]="chat.photo" alt="Avatar" class="avatar-image">
        </div>
        <div class="conversation-content">
          <div class="conversation-header">
            <span class="name">{{ chat.firstName }} {{ chat.lastName }}</span>
            <span class="time">{{ getMessageDate(chat.sendDate )| date:'shortTime' }}</span>
          </div>
          <div class="message-preview">{{ chat.message }}</div>
        </div>
        <span class="badge" *ngIf="chat.numberOfUnread > 0">{{ chat.numberOfUnread }}</span>
        </ng-container>
      </div>
    </div>

    <div *ngIf="isLoading && displayedChats.length === 0" class="loading">
      Loading conversations...
    </div>
  </div>
</div>
